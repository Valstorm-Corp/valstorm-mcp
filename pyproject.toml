[project]
name = "valstorm-mcp-server @ git+https://github.com/Valstorm-Corp/valstorm-mcp.git"
version = "1.0.1"
description = "Hosted MCP server proxy for the Valstorm platform"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Valstorm Engineering", email = "engineering@valstorm.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0,<2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.6.0",
    "pyjwt[crypto]>=2.15.0",
    "cryptography>=44.0.0",
    "valstorm-client @ git+https://github.com/Valstorm-Corp/valstorm-client-python.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
    "pip-licenses>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/valstorm_mcp"]

[project.scripts]
valstorm-mcp = "valstorm_mcp.server:main"
valstorm-mcp-server = "valstorm_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["valstorm_mcp", "valstorm"]
